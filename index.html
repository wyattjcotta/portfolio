<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wyatt cotta dot com</title>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
    <link rel="manifest" href="assets/img/site.webmanifest">
    <link rel="mask-icon" href="assets/img/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <style>
      body {
          margin: 0;
          font-family: Arial, sans-serif;
          text-align: center;
      }

      .bg-image {
          background-repeat: no-repeat;
          background-size: cover;
          width: 100%;
          height: 100vh;
      }

      .header {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          color: white;
          text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      .countdown {
          color: white;
          font-size: 24px;
          margin-top: 20px;
      }

      .link {
          display: none;
          color: white;
          font-size: 18px;
          margin-top: 10px;
      }


      /* Lightbox */
      .carousel {
          position: relative;
          width: 100%;
          height: 300px;
          overflow: hidden;
      }

      .carousel-inner {
          display: flex;
          transition: transform 0.5s  
      ease-in-out;
      }

      .carousel-inner img {
          width: 100%;
          height: 100%;
          object-fit: cover;  

      }

      .prev, .next {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          background-color: rgba(0, 0, 0, 0.5);
          color: white;
          font-size: 24px;
          padding: 10px  
      20px;
          border: none;
          cursor: pointer;
      }

      .prev {
          left: 0;
      }

      .next {
          right: 0;
      }
    </style>
  </head>
<body>
    <div id="home" class="bg-image"></div>

    <script>
        const bgImage = document.getElementById('home');
        const imageFolder = 'assets/img/'; // Replace with your actual image folder path
        const imageFiles = ['xmas1.gif', 'xmas2.gif', 'xmas3.gif', 'xmas4.gif', 'xmas5.gif', 'xmas6.gif', 'xmas7.gif', 'xmas8.gif'];

        let imageIndex = 0;

        const changeImage = () => {
            bgImage.style.backgroundImage = `url(${imageFolder}${imageFiles[imageIndex]})`;
            imageIndex = (imageIndex + 1) % imageFiles.length;
        };

        setInterval(changeImage, 5000);
    </script>

    <div class="header">
        <h1>10 YEARS OF CHRISTMAS CARDS</h1>
        <p id="countdown"></p>
        <a id="link" href="#gallery">Explore the last decade of my cards</a>
    </div>

    <script>
        const countdownElement = document.getElementById('countdown');
        const linkElement = document.getElementById('link');

        const countdownDate = new Date("Dec 25, 2024 00:00:00").getTime();

        const intervalId = setInterval(() => {
            const now = new Date().getTime();
            const distance = countdownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            countdownElement.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;

            if (distance < 0) {
                clearInterval(intervalId);
                countdownElement.textContent = "Merry Christmas!";
                linkElement.style.display = 'block';
            }
        }, 1000);
    </script>




/* CAROUSEL */
    <div class="carousel">
      <div class="carousel-inner">
          <img src="assets/img/2014.jpg" alt="2014">
          <img src="assets/img/2015.jpg" alt="2015">
          <img src="assets/img/2016.jpg" alt="2016">
          <img src="assets/img/2017.jpg" alt="2017">
          <img src="assets/img/2018.jpg" alt="2018">
          <img src="assets/img/2019.jpg" alt="2019">
          <img src="assets/img/2020.jpg" alt="2020">
          <img src="assets/img/2021.jpg" alt="2021">
          <img src="assets/img/2022.jpg" alt="2022">
          <img src="assets/img/2023.jpg" alt="2023">
          <img src="assets/img/2024.jpg" alt="2024">
      </div>
      <button class="prev">&#10094;</button>
      <button class="next">&#10095;</button>
    </div>

    <script>
      const carouselInner = document.querySelector('.carousel-inner');
      const prevBtn = document.querySelector('.prev');
      const nextBtn = document.querySelector('.next');  

      const images = carouselInner.children;
      let currentIndex = 0;

      const slide = () => {
          carouselInner.style.transform = `translateX(-${currentIndex * 100}%)`;
      };

      const prevSlide = () => {
          currentIndex = (currentIndex - 1 + images.length) % images.length;
          slide();
      };

      const nextSlide = () => {
          currentIndex = (currentIndex + 1) % images.length;
          slide();
      };

      prevBtn.addEventListener('click', prevSlide);
      nextBtn.addEventListener('click', nextSlide);

      // Initial slide
      slide();
    </script>
  </body>
</html>
