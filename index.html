<body>
<div id="home" class="bg-image"></div>

<script>
const bgImage = document.getElementById('home');
const imageFolder = 'assets/img/'; // Replace with your actual image folder path
const imageFiles = ['xmas1.gif', 'xmas2.gif', 'xmas3.gif', 'xmas4.gif', 'xmas5.gif', 'xmas6.gif', 'xmas7.gif', 'xmas8.gif'];

let imageIndex = 0;

const changeImage = () => {
bgImage.style.backgroundImage = `url(${imageFolder}${imageFiles[imageIndex]})`;
imageIndex = (imageIndex + 1) % imageFiles.length;
};

setInterval(changeImage, 5000);
</script>

<div class="header">
<h1>10 YEARS OF CHRISTMAS CARDS</h1>
<p id="countdown"></p>
<a id="link" href="#gallery">Explore a Decade of Stupid Cards</a>
</div>

<script>
const countdownElement = document.getElementById('countdown');
const linkElement = document.getElementById('link');

const countdownDate = new Date("Dec 25, 2024 00:00:00").getTime();

const intervalId = setInterval(() => {
const now = new Date().getTime();
const distance = countdownDate - now;

const days = Math.floor(distance / (1000 * 60 * 60 * 24));
const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
const seconds = Math.floor((distance % (1000 * 60)) / 1000);

countdownElement.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;

if (distance < 0) {
clearInterval(intervalId);
countdownElement.textContent = "Merry Christmas!";
linkElement.style.display = 'block';
}
}, 1000);
</script>

    <script>
      function openLightbox(index) {
        const images = document.querySelectorAll('.image-gallery img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const  
    caption = document.getElementById('caption');

        lightboxImg.src = images[index].src;
        caption.textContent = images[index].alt;
        lightbox.style.display = 'block';
      }

      function closeLightbox() {
        const lightbox = document.getElementById('lightbox');
        lightbox.style.display = 'none';
      }
    </script>
