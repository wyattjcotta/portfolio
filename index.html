<!DOCTYPE html>

<head>

    <style>
      body {
          margin: 0;
          font-family: Arial, sans-serif;
          text-align: center;
      }

      .bg-image {
          background-repeat: no-repeat;
          background-size: cover;
          width: 100%;
          height: 100vh;
      }

      .header {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          color: white;
          text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      .countdown {
          color: white;
          font-size: 24px;
          margin-top: 20px;
      }

      .link {
          display: none;
          color: white;
          font-size: 18px;
          margin-top: 10px;
      }
      /* Your existing CSS styles here */
      .daily-image-section {
          text-align: center;
          margin-top: 20px;
      }
      .daily-image {
          width: 100%;
          max-width: 500px;
          margin: 20px auto;
      }
      .image-title {
          font-weight: bold;
          font-size: 18px;
      }
      .image-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      }

    .image-frame {
      border: 2px solid black;
      margin: 10px;
      padding: 10px;
      }

    .image-frame img {
      width: 200px;
      height: auto;
      }
    .image-gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }

      .image-gallery img {
        width: 200px;
        margin: 10px;
        cursor: pointer;
      }

      .lightbox {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);  

        justify-content: center;
        align-items: center;
      }

      .lightbox img {
        max-width: 80%;
        max-height: 80%;
      }

      .close-btn {
        position: absolute;
        top:  
        10px;
        right: 10px;
        font-size: 24px;
        color: white;
        cursor: pointer;
      }  
    </style>
  </head>
<body>
    <div id="home" class="bg-image"></div>

    <script>
        const bgImage = document.getElementById('home');
        const imageFolder = 'assets/img/'; // Replace with your actual image folder path
        const imageFiles = ['xmas1.gif', 'xmas2.gif', 'xmas3.gif', 'xmas4.gif', 'xmas5.gif', 'xmas6.gif', 'xmas7.gif', 'xmas8.gif'];

        let imageIndex = 0;

        const changeImage = () => {
            bgImage.style.backgroundImage = `url(${imageFolder}${imageFiles[imageIndex]})`;
            imageIndex = (imageIndex + 1) % imageFiles.length;
        };

        setInterval(changeImage, 5000);
    </script>

    <div class="header">
        <h1>10 YEARS OF CHRISTMAS CARDS</h1>
        <p id="countdown"></p>
        <a id="link" href="#gallery">Explore a Decade of Stupid Cards</a>
    </div>

    <script>
        const countdownElement = document.getElementById('countdown');
        const linkElement = document.getElementById('link');

        const countdownDate = new Date("Dec 25, 2024 00:00:00").getTime();

        const intervalId = setInterval(() => {
            const now = new Date().getTime();
            const distance = countdownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            countdownElement.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;

            if (distance < 0) {
                clearInterval(intervalId);
                countdownElement.textContent = "Merry Christmas!";
                linkElement.style.display = 'block';
            }
        }, 1000);
    </script>

    <div id="lightbox" class="lightbox">
      <span class="close-btn" onclick="closeLightbox()">×</span>
      <img id="lightbox-img" src="">
      <div id="caption"></div>
    </div>

    <script>
      function openLightbox(index) {
        const images = document.querySelectorAll('.image-gallery img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const  
    caption = document.getElementById('caption');

        lightboxImg.src = images[index].src;
        caption.textContent = images[index].alt;
        lightbox.style.display = 'block';
      }

      function closeLightbox() {
        const lightbox = document.getElementById('lightbox');
        lightbox.style.display = 'none';
      }
    </script>
